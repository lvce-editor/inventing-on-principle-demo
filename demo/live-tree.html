<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventing on Principle · Live Tree</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #171b1a;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        color: #ece9df;
      }
      header {
        z-index: 1;
        display: flex;
        align-items: baseline;
        gap: 18px;
        padding: 14px 22px;
        border-bottom: 1px solid #343a37;
        background: #1f2422;
      }
      header strong {
        color: #ef9a82;
        font:
          700 11px/1 ui-monospace,
          monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      header span {
        color: #aeb5af;
        font-size: 13px;
      }
      main {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(330px, 0.82fr) minmax(440px, 1.18fr);
      }
      section {
        min-width: 0;
        min-height: 0;
      }
      .source-pane {
        display: grid;
        grid-template-rows: auto 1fr auto;
        border-right: 1px solid #343a37;
        background: #202523;
      }
      .pane-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px;
        border-bottom: 1px solid #343a37;
        color: #c8cec9;
        font:
          12px/1 ui-monospace,
          monospace;
      }
      .live-indicator::before {
        content: '';
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        border-radius: 50%;
        background: #91b087;
        box-shadow: 0 0 12px #91b087;
      }
      textarea {
        width: 100%;
        height: 100%;
        min-height: 0;
        resize: none;
        padding: 24px 26px;
        border: 0;
        outline: 0;
        color: #e9e6dc;
        background: linear-gradient(90deg, #1b201e 0 47px, transparent 47px), repeating-linear-gradient(#202523 0 27px, #242a27 28px);
        caret-color: #ef9a82;
        font:
          15px/28px 'SFMono-Regular',
          Consolas,
          ui-monospace,
          monospace;
        tab-size: 2;
      }
      textarea::selection {
        color: #fff;
        background: #815b50;
      }
      .error {
        min-height: 42px;
        padding: 11px 18px;
        border-top: 1px solid #343a37;
        color: #9fa7a1;
        font:
          12px/1.5 ui-monospace,
          monospace;
      }
      .error[data-state='error'] {
        color: #f1a08b;
      }
      .stage {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 34%, rgb(255 255 255 / 70%), transparent 42%), #f3efe5;
      }
      canvas {
        display: block;
        width: min(94%, 960px);
        height: auto;
        aspect-ratio: 3 / 2;
      }
      output {
        position: absolute;
        top: 18px;
        right: 22px;
        color: #756d5f;
        font:
          12px/1.4 ui-monospace,
          monospace;
        letter-spacing: 0.04em;
      }
      .try-this {
        position: absolute;
        bottom: 18px;
        left: 22px;
        padding: 8px 11px;
        border: 1px solid rgb(92 83 67 / 18%);
        border-radius: 6px;
        color: #6f675a;
        background: rgb(255 255 255 / 52%);
        font:
          12px/1.4 ui-monospace,
          monospace;
        backdrop-filter: blur(8px);
      }
      @media (max-width: 820px) {
        header span,
        .try-this {
          display: none;
        }
        main {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(260px, 0.8fr) minmax(320px, 1.2fr);
        }
        .source-pane {
          border-right: 0;
          border-bottom: 1px solid #343a37;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Immediate connection</strong>
      <span>Edit the program. The tree answers before you save, run, or leave the thought.</span>
    </header>
    <main>
      <section class="source-pane" aria-label="Tree source">
        <div class="pane-title">
          <span>live-tree.js</span>
          <span class="live-indicator">LIVE</span>
        </div>
        <textarea id="source" aria-label="Editable tree program" autocomplete="off" spellcheck="false"></textarea>
        <div id="error" class="error" role="status">Try changing one number.</div>
      </section>
      <section class="stage" aria-label="Live tree preview">
        <output id="tree-status" aria-live="polite"></output>
        <canvas id="tree" width="960" height="640" role="img" aria-label="A recursively drawn tree"></canvas>
        <div class="try-this">Try depth 7 → 10, spread 22 → 38, or wind 0 → 0.14</div>
      </section>
    </main>
    <script>
      const initialSource = `// Change a value. Watch the idea respond.
const depth = 7
const spread = 22
const lengthRatio = 0.72
const wind = 0
const blossomCount = 18
const leafColor = '#718355'`

      const source = document.querySelector('#source')
      const error = document.querySelector('#error')
      const canvas = document.querySelector('#tree')
      const status = document.querySelector('#tree-status')
      const context = canvas.getContext('2d')
      const maximumBranches = 20_000
      source.value = initialSource

      const numberValue = (text, name, minimum, maximum) => {
        const match = text.match(new RegExp(`^\\s*const\\s+${name}\\s*=\\s*(-?\\d+(?:\\.\\d+)?)\\s*$`, 'm'))
        if (!match) throw new Error(`Finish the ${name} assignment to continue`)
        const value = Number(match[1])
        if (!Number.isFinite(value) || value < minimum || value > maximum) {
          throw new Error(`${name} must be between ${minimum} and ${maximum}`)
        }
        return value
      }

      const colorValue = (text, name) => {
        const match = text.match(new RegExp(`^\\s*const\\s+${name}\\s*=\\s*['"](#(?:[\\da-f]{3}|[\\da-f]{6}))['"]\\s*$`, 'im'))
        if (!match) throw new Error(`${name} needs a quoted hex color`)
        return match[1]
      }

      const parse = (text) => ({
        blossomCount: Math.floor(numberValue(text, 'blossomCount', 0, 2_048)),
        depth: Math.floor(numberValue(text, 'depth', 1, 12)),
        leafColor: colorValue(text, 'leafColor'),
        lengthRatio: numberValue(text, 'lengthRatio', 0.5, 0.84),
        spread: numberValue(text, 'spread', 0, 70),
        wind: numberValue(text, 'wind', -1, 1),
      })

      const noise = (seed) => {
        const value = Math.sin(seed * 12.9898) * 43_758.5453
        return value - Math.floor(value)
      }

      const draw = ({ blossomCount, depth, leafColor, lengthRatio, spread, wind }) => {
        let branches = 0
        let blossoms = 0
        const availableTips = 2 ** (depth - 1)
        const safeBlossomCount = Math.min(blossomCount, availableTips)

        context.fillStyle = '#f3efe5'
        context.fillRect(0, 0, canvas.width, canvas.height)
        context.fillStyle = '#d8d0bb'
        context.beginPath()
        context.ellipse(480, 613, 390, 18, 0, 0, Math.PI * 2)
        context.fill()

        const drawTip = (x, y, seed) => {
          context.fillStyle = leafColor
          for (const [offsetX, offsetY, radius] of [
            [-6, 2, 8],
            [5, 4, 9],
            [0, -5, 10],
          ]) {
            context.beginPath()
            context.arc(x + offsetX, y + offsetY, radius, 0, Math.PI * 2)
            context.fill()
          }
          if (noise(seed + 91) * availableTips >= safeBlossomCount) return
          context.fillStyle = '#d9868c'
          context.beginPath()
          context.arc(x + 2, y - 3, 4, 0, Math.PI * 2)
          context.fill()
          blossoms++
        }

        const grow = (x, y, length, angle, level, seed) => {
          if (++branches > maximumBranches) throw new Error('This tree has too many branches to draw safely')
          const heading = angle + wind * 12
          const radians = (heading * Math.PI) / 180
          const nextX = x + Math.cos(radians) * length
          const nextY = y + Math.sin(radians) * length
          context.strokeStyle = level > 2 ? '#403a31' : '#5a5145'
          context.lineWidth = Math.max(1.2, level * 1.35)
          context.lineCap = 'round'
          context.beginPath()
          context.moveTo(x, y)
          context.lineTo(nextX, nextY)
          context.stroke()
          if (level === 1) return drawTip(nextX, nextY, seed)
          const variation = (noise(seed) - 0.5) * 5
          grow(nextX, nextY, length * lengthRatio, heading - spread + variation, level - 1, seed * 2)
          grow(nextX, nextY, length * lengthRatio, heading + spread + variation, level - 1, seed * 2 + 1)
        }

        grow(480, 608, 112, -90, depth, 1)
        status.dataset.depth = String(depth)
        status.dataset.branchcount = String(branches)
        status.dataset.blossomcount = String(blossoms)
        status.textContent = `${branches.toLocaleString()} branches · ${blossoms} blossoms`
        canvas.setAttribute('aria-label', `A recursive tree with ${branches} branches and ${blossoms} blossoms`)
      }

      const render = () => {
        try {
          draw(parse(source.value))
          source.setAttribute('aria-invalid', 'false')
          error.dataset.state = 'valid'
          error.textContent = 'Live — keep shaping it.'
        } catch (cause) {
          source.setAttribute('aria-invalid', 'true')
          error.dataset.state = 'error'
          error.textContent = cause instanceof Error ? cause.message : String(cause)
        }
      }

      source.addEventListener('input', render)
      source.addEventListener('keydown', (event) => {
        if (event.key !== 'Tab') return
        event.preventDefault()
        source.setRangeText('  ', source.selectionStart, source.selectionEnd, 'end')
        render()
      })
      render()
      source.focus()
      const depthStart = source.value.indexOf('7')
      source.setSelectionRange(depthStart, depthStart + 1)
    </script>
  </body>
</html>
